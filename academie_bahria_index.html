<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية بحرية | المنصة التعليمية</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;min-height:100vh;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:1100px;min-height:650px;display:flex;overflow:hidden;border:1px solid #b8944c;border-radius:24px;background:#151515;box-shadow:0 20px 60px #0008}
.welcome{width:50%;padding:60px 45px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(145deg,#181818,#0c0c0c)}
.logo{width:125px;height:125px;border:2px solid #b8944c;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:28px;color:#d6b56a;font-size:38px;font-weight:bold;letter-spacing:-4px}
.welcome h1{color:#d6b56a;font-size:32px;margin-bottom:12px}.welcome h2{font-size:18px;font-weight:normal;color:#ddd;margin-bottom:25px}.welcome p{color:#aaa;line-height:1.9;max-width:430px}
.login{width:50%;padding:55px 45px;background:#202020;display:flex;flex-direction:column;justify-content:center}
.login h2{font-size:27px;margin-bottom:10px}.subtitle{color:#999;margin-bottom:30px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:25px}
.role{border:1px solid #444;background:#171717;color:#ddd;border-radius:12px;padding:15px 10px;cursor:pointer;transition:.2s;font-size:15px}
.role:hover,.role.active{border-color:#b8944c;color:#d6b56a;background:#252015}
label{display:block;margin-bottom:8px;color:#ddd;font-size:14px}
input{width:100%;padding:14px;margin-bottom:18px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;outline:none;font-size:15px}
input:focus{border-color:#b8944c}
.login-btn{width:100%;padding:15px;border:none;border-radius:10px;background:#b8944c;color:#111;font-size:16px;font-weight:bold;cursor:pointer}
.login-btn:hover{background:#d6b56a}.forgot{text-align:center;margin-top:18px;color:#b8944c;font-size:13px}.footer{margin-top:35px;text-align:center;color:#666;font-size:12px}
@media(max-width:800px){.container{flex-direction:column}.welcome,.login{width:100%}.welcome{padding:45px 25px}.login{padding:40px 25px}.welcome h1{font-size:27px}}
</style>
</head>
<body>
<main class="container">
<section class="welcome">
<div class="logo">BH</div>
<h1>أكاديمية بحرية</h1>
<h2>المنصة التعليمية</h2>
<p>منصة تجمع الإدارة والأساتذة والتلاميذ والأولياء في فضاء تعليمي واحد، لمتابعة الدراسة والحضور والنتائج والبرامج والإعلانات.</p>
</section>
<section class="login">
<h2>مرحباً بك 👋</h2>
<p class="subtitle">اختر نوع الحساب ثم أدخل بيانات الدخول</p>
<div class="roles">
<button class="role active" onclick="selectRole(this,'الإدارة')">👨‍💼 الإدارة</button>
<button class="role" onclick="selectRole(this,'الأستاذ')">👨‍🏫 الأستاذ</button>
<button class="role" onclick="selectRole(this,'التلميذ')">👨‍🎓 التلميذ</button>
<button class="role" onclick="selectRole(this,'الولي')">👨‍👩‍👧 الولي</button>
</div>
<label for="username">اسم المستخدم</label>
<input id="username" type="text" placeholder="أدخل اسم المستخدم">
<label for="password">كلمة المرور</label>
<input id="password" type="password" placeholder="أدخل كلمة المرور">
<button class="login-btn" onclick="login()">تسجيل الدخول</button>
<div class="forgot">نسيت كلمة المرور؟</div>
<div class="footer">© 2026 أكاديمية بحرية — جميع الحقوق محفوظة</div>
</section>
</main>
<script>
let selectedRole="الإدارة";
function selectRole(button,role){document.querySelectorAll(".role").forEach(b=>b.classList.remove("active"));button.classList.add("active");selectedRole=role}
function login(){let u=document.getElementById("username").value.trim(),p=document.getElementById("password").value.trim();if(!u||!p){alert("يرجى إدخال اسم المستخدم وكلمة المرور.");return}alert("تم اختيار حساب: "+selectedRole+"\\n\\nواجهة تسجيل الدخول سيتم ربطها بقاعدة البيانات لاحقاً.")}
</script>
</body>
</html>
